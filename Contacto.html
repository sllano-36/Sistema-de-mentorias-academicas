```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contáctenos</title>

    <link rel="stylesheet" href="style-C.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Contáctenos</h1>
    </header>

    <!-- MAIN -->
    <main>

        <section class="contenedor-formulario">

            <form>

                <!-- Nombre -->
                <div class="campo">
                    <label for="nombre">Nombre:</label>

                    <input
                        type="text"
                        id="nombre"
                        required>
                </div>

                <!-- Email -->
                <div class="campo">
                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email">
                </div>

                <!-- Mensaje -->
                <div class="campo">
                    <label for="mensaje">Mensaje:</label>

                    <textarea
                        id="mensaje"
                        rows="5"></textarea>
                </div>

                <!-- Opiniones -->
                <div class="campo">
                    <label for="opiniones">Opiniones:</label>

                    <textarea
                        id="opiniones"
                        rows="4"></textarea>
                </div>

                <!-- Botón -->
                <button type="submit">
                    Enviar
                </button>

                <!-- Link volver -->
                <div class="volver-contenedor">

                    <a href="index.html" class="volver">
                        ← Volver al inicio
                    </a>

                </div>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>Contacto: mentorias@cesde.edu</p>

        <p>Teléfono: 3152050549</p>

        <p>© 2026 Sistema de Mentorías Académicas</p>

    </footer>

</body>

</html>
```
